name: Build universal APK

# Both packages contain only shell/ucode/JS files, so PKGARCH=all is valid:
# one build produces an APK that installs on every OpenWrt 25 architecture.
# Tag v* -> build + attach APKs to the GitHub release.
# Manual run -> build + upload workflow artifact only.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'OpenWrt SDK release'
        required: false
        default: '25.12.6'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: ${{ github.event.inputs.sdk_version || '25.12.6' }}
  SDK_TARGET: x86/64

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify architecture-independent packages
        run: |
          set -euo pipefail
          grep -qE '^[[:space:]]*PKGARCH:=all[[:space:]]*$' packages/mrdark-core/Makefile
          grep -qE '^[[:space:]]*LUCI_PKGARCH:=all[[:space:]]*$' packages/luci-app-mrdark/Makefile
          echo "mrdark-core and luci-app-mrdark are marked all/noarch"

      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bison flex gawk gettext libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev zstd

      - name: Download OpenWrt SDK
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${SDK_VERSION}/targets/${SDK_TARGET}/"
          sdk_file="$(curl -fsSL "$base" | grep -oE 'openwrt-sdk-[^"]+Linux-x86_64\.tar\.zst' | sed -n '1p' || true)"
          if [ -z "$sdk_file" ]; then
            echo "OpenWrt SDK not found at $base" >&2
            exit 1
          fi
          echo "Downloading ${base}${sdk_file}"
          curl -fL --retry 3 --retry-delay 5 -o /tmp/sdk.tar.zst "${base}${sdk_file}"
          mkdir -p "$RUNNER_TEMP/sdk"
          tar --zstd -xf /tmp/sdk.tar.zst -C "$RUNNER_TEMP/sdk" --strip-components=1
          rm -f /tmp/sdk.tar.zst
          echo "SDK_DIR=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"

      - name: Prepare SDK
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          cd "$SDK_DIR"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          rm -rf package/mrdark-core package/luci-app-mrdark
          cp -r "$GITHUB_WORKSPACE/packages/mrdark-core" package/
          cp -r "$GITHUB_WORKSPACE/packages/luci-app-mrdark" package/

          # Force a package rescan: after copying sources the SDK may still
          # have tmp/.packageinfo from feeds install.
          rm -rf tmp

          # The SDK ships no .config, and its ALL* defaults are fatal here:
          #   CONFIG_ALL / CONFIG_ALL_NONSHARED / CONFIG_ALL_KMODS = y
          # select every package of the tree, so package dependency edges pull
          # package/toolchain in, whose install step tries to copy libasan.so
          # from a musl toolchain that does not have it.  Selecting only the
          # two packages we need avoids that entire dependency graph.
          if [ -f .config ]; then
            sed -i '/^CONFIG_PACKAGE_mrdark-core/d; /^CONFIG_PACKAGE_luci-app-mrdark/d; /^CONFIG_PACKAGE_luci-base/d' .config
          fi
          cat >> .config <<'EOF'
          # CONFIG_ALL is not set
          # CONFIG_ALL_NONSHARED is not set
          # CONFIG_ALL_KMODS is not set
          CONFIG_PACKAGE_mrdark-core=y
          CONFIG_PACKAGE_luci-app-mrdark=y
          CONFIG_PACKAGE_luci-base=y
          EOF

          make defconfig

          for pkg in mrdark-core luci-app-mrdark luci-base; do
            if ! grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then
              echo "ERROR: CONFIG_PACKAGE_${pkg}=y is missing after make defconfig" >&2
              grep -n "CONFIG_PACKAGE_${pkg}" .config >&2 || true
              exit 1
            fi
          done

          # Diagnostics kept in build.log for the failure summary / artifact.
          echo "== selected packages =="
          grep -E '^CONFIG_PACKAGE_(mrdark-core|luci-app-mrdark|luci-base)=y$' .config
          echo "== ALL switches =="
          grep -E 'CONFIG_ALL(_NONSHARED|_KMODS)?' .config || true
          echo "== package metadata =="
          grep -c 'mrdark-core' tmp/.packageinfo || true

      - name: Build mrdark-core
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          cd "$SDK_DIR"
          # Build inside the package dir on purpose: the outer
          # `make package/<name>/compile` target carries the dependency edges
          # generated in tmp/.packagedeps, and for a pure noarch package those
          # edges only add work (and break the SDK, see Prepare SDK).
          # The package Makefile starts with `include $(TOPDIR)/rules.mk`, and
          # TOPDIR is normally exported by the top-level OpenWrt make run, so
          # it has to be provided here as well.
          export TOPDIR="$SDK_DIR"
          # Fallback: the SDK top-level target builds the whole dependency
          # chain (and is the officially supported entry point), so it is only
          # worth its extra minutes if the direct build did not work.
          if ! make -C package/mrdark-core compile V=s; then
            echo "WARNING: direct build of mrdark-core failed, retrying through the SDK top-level target" >&2
            make package/mrdark-core/compile V=s
          fi
          # `find | wc -l` and not `find | grep -q`: under pipefail a SIGPIPE
          # from find (grep exiting early) would look like a failure.
          apk_count="$(find bin/packages -name 'mrdark-core-*.apk' | wc -l)"
          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: mrdark-core APK was not produced" >&2
            exit 1
          fi
          find bin/packages -name 'mrdark-core-*.apk'

      - name: Build LuCI app
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          cd "$SDK_DIR"
          export TOPDIR="$SDK_DIR"
          if ! make -C package/luci-app-mrdark compile V=s; then
            echo "WARNING: direct build of luci-app-mrdark failed, retrying through the SDK top-level target" >&2
            make package/luci-app-mrdark/compile V=s
          fi
          apk_count="$(find bin/packages -name 'luci-app-mrdark-*.apk' | wc -l)"
          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: luci-app-mrdark APK was not produced" >&2
            exit 1
          fi
          find bin/packages -name 'luci-app-mrdark-*.apk'

      - name: Collect APK files
        run: |
          set -euo pipefail
          mkdir -p dist
          find "$SDK_DIR/bin/packages" -type f \
            \( -name 'mrdark-core-*.apk' -o -name 'luci-app-mrdark-*.apk' \) \
            -exec cp -v {} dist/ \;
          count="$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "ERROR: expected 2 APK files, found $count" >&2
            find "$SDK_DIR/bin/packages" -type f -name '*.apk' | head -20 >&2 || true
            exit 1
          fi
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
          ls -lh dist

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Show build log on failure
        if: failure()
        run: |
          {
            echo '## Build failed'
            echo '### errors found in the log'
            echo '```'
            grep -nE '(^|[[:space:]])(make(\[[0-9]+\])?: \*\*\*|\*\*\* No rule|No such file|No targets specified|ERROR:|error:)' "$GITHUB_WORKSPACE/build.log" 2>/dev/null | tail -n 40 || true
            echo '```'
            echo '### last 150 log lines'
            echo '```'
            tail -n 150 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: darkcapture-wrt-universal-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK files to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
